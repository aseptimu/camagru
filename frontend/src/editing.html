<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Camagru — Editing</title>
    <link rel="stylesheet" href="css/editing.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/global.css" />
</head>
<body>
<header>
    <div class="mainInfoWrapper">
        <h1><a href="/" class="logo-link">Camagru</a></h1>
    </div>
    <nav class="auth">
        <a id="linkRegister" class="authLink green hide" href="/register">Register</a>
        <a id="linkLogin"    class="authLink green hide" href="/login">Login</a>
        <a id="linkUpdate"   class="authLink green hide" href="/updateProfile">Update Profile</a>
        <a id="linkLogout"   class="authLink red   hide" href="#">Logout</a>
        <span id="userName" class="user-name hide"></span>
    </nav>
</header>

<div class="container">
    <main id="editor-main">
        <section class="camera-section">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
                <img id="overlayDisplay" class="overlay" src="" alt="" />
            </div>

            <div class="controls">
                <button id="startCam">Start Camera</button>
                <button id="captureBtn" disabled>Capture</button>
                <button id="uploadBtn" disabled>Upload</button>
                <input type="file" id="uploadInput" accept="image/*" class="hide" />
            </div>

            <div class="overlays-section">
                <h2>Choose Overlay</h2>
                <div id="overlaysList" class="overlays-list"></div>
            </div>
        </section>
    </main>

    <aside id="editor-side">
        <h2>Your Images</h2>
        <div id="userImages" class="user-images"></div>
    </aside>
</div>

<footer>
    <p>&copy; 2025 Camagru by aseptimu</p>
</footer>

<script src="js/editing.js"></script>
<script src="js/header.js"></script>
</body>
</html>
