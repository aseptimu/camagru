<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Camagru – Password recovery</title>
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/auth.css"/>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<header>
    <div class="mainInfoWrapper">
        <h1><a href="/" class="logo-link">Camagru</a></h1>
    </div>
</header>

<main>
    <div class="form-wrapper">
        <form id="recoverForm" class="auth-form">
            <h2>Password recovery</h2>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required/>
            <button type="submit" class="submit-btn">Send link</button>
            <p id="recoverError" class="error"></p>
            <p class="form-footer">
                <a href="/login">Login</a> |
                <a href="/register">Register</a>
            </p>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2025 Camagru by aseptimu</p>
</footer>

<script src="js/header.js" defer></script>
<script src="js/recover.js" defer></script>
</body>
</html>
