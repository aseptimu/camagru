<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header>
    <div class="mainInfoWrapper">
        <h1><a href="/" class="logo-link">Camagru</a></h1>
    </div>
    <nav class="auth">
        <a id="linkRegister" class="authLink green hide" href="/register">Register</a>
        <a id="linkLogin"    class="authLink green hide" href="/login">Login</a>
        <a id="linkUpdate"   class="authLink green hide" href="/updateProfile">Update Profile</a>
        <a id="linkLogout"   class="authLink red   hide" href="#">Logout</a>
        <span id="userName"  class="user-name hide"></span>
    </nav>
</header>
<main>
    <div class="form-wrapper">
        <div id="confirmMessage" class="auth-form">
            <p>Verifying...</p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2025 Camagru by aseptimu</p>
</footer>

<script src="js/confirm.js"></script>
<script src="js/header.js" defer></script>
</body>
</html>
